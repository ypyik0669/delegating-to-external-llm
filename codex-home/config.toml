# Template for LLM_CODEX_HOME=private (the default): lean lane configuration.
# codex-lane.sh copies this only on first use to ~/.claude/llm-codex-home/config.toml;
# codex keeps runtime state and trust entries there, never in the plugin directory.
# LLM_CODEX_HOME=shared uses the user's CODEX_HOME or ~/.codex, including plugins,
# MCP servers, skills, AGENTS.md and trust entries. An explicit existing path is also supported.
# LANE_CODEX_HOME takes precedence. Shared/path homes are never created or seeded by the lane.
# Measured base input per run: private 42k vs shared 122k (~3x).
# Model, relay provider, effort and sandbox are passed on the command line in every mode.

disable_response_storage = true
model_verbosity = "low"
model_reasoning_summary = "none"
web_search = "disabled"
project_doc_max_bytes = 0

[shell_environment_policy]
inherit = "core"
