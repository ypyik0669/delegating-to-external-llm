<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="34" font-size="16" font-weight="600" fill="#111827">Same two tasks on supermemory (Bun/Turbo monorepo, 58k LOC) — where Claude's tokens went</text>
  <text x="30" y="54" font-size="12" fill="#6b7280">Claude-side tokens outside the main conversation (exploration + lane supervision + review). External model did the code in both runs.</text>

  <!-- axis -->
  <line x1="230" y1="80" x2="230" y2="250" stroke="#d1d5db"/>
  <g font-size="12" fill="#6b7280">
    <text x="230" y="270" text-anchor="middle">0</text>
    <text x="405" y="270" text-anchor="middle">50k</text>
    <text x="580" y="270" text-anchor="middle">100k</text>
    <text x="755" y="270" text-anchor="middle">150k</text>
    <text x="930" y="270" text-anchor="middle">200k</text>
  </g>
  <g stroke="#f3f4f6"><line x1="405" y1="80" x2="405" y2="250"/><line x1="580" y1="80" x2="580" y2="250"/><line x1="755" y1="80" x2="755" y2="250"/><line x1="930" y1="80" x2="930" y2="250"/></g>

  <!-- v2.1 bar: 200k -> 700px -->
  <text x="215" y="120" text-anchor="end" font-weight="600" fill="#111827">v2.1</text>
  <text x="215" y="138" text-anchor="end" font-size="12" fill="#6b7280">3 Explore agents, 2 LLM supervisors, advisor</text>
  <rect x="230" y="100" width="402" height="44" fill="#f59e0b" opacity="0.9"/>
  <rect x="632" y="100" width="210" height="44" fill="#fb923c" opacity="0.9"/>
  <rect x="842" y="100" width="88" height="44" fill="#fdba74" opacity="0.9"/>
  <text x="240" y="128" fill="#111827" font-size="12">115k exploration</text>
  <text x="640" y="128" fill="#111827" font-size="12">60k supervising</text>
  <text x="850" y="128" fill="#111827" font-size="12">26k</text>
  <text x="235" y="160" font-size="12" fill="#6b7280">≈ 201k · plus 3 manual clean-ups by Claude (stray writes, lockfile, lane commits)</text>

  <!-- v2.3 bar: 25.7k -> 90px -->
  <text x="215" y="205" text-anchor="end" font-weight="600" fill="#111827">v2.3</text>
  <text x="215" y="223" text-anchor="end" font-size="12" fill="#6b7280">analyze lane, lane-run.mjs, codex review</text>
  <rect x="230" y="185" width="90" height="44" fill="#10b981" opacity="0.9"/>
  <text x="330" y="213" fill="#111827" font-size="12">25.7k — the advisor's verdict only · 0 Reads · 0 Explore agents · 0 hand edits</text>

  <text x="30" y="300" font-size="12" fill="#6b7280">Results were equivalent or better: v2.3 landed 65 + 83 passing tests, type-checks green, lockfile delta +3 lines, advisor verdict "ship". External spend: 3.5M prompt tokens (85% cache hits), 27k output, ~60 min wall.</text>
  <text x="30" y="318" font-size="12" fill="#6b7280">Remaining cost is the main conversation itself (41 turns while polling); v2.3.1 runs lanes in the background so the session is woken once.</text>
</svg>
