<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="60" y="34" font-size="12" fill="#6b7280" letter-spacing="1">CLAUDE（会话模型）· 只做判断</text>
  <text x="470" y="34" font-size="12" fill="#6b7280" letter-spacing="1">你中转上的外部模型 · 所有读代码、写代码、评审</text>
  <line x1="440" y1="44" x2="440" y2="400" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <g>
    <rect x="40" y="60" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="82" font-weight="600" fill="#1e1b4b">1 · 一句话说任务</text>
    <text x="60" y="100" fill="#4338ca">不读仓库代码</text>
    <rect x="40" y="150" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="172" font-weight="600" fill="#1e1b4b">3 · 审批 spec 草稿</text>
    <text x="60" y="190" fill="#4338ca">回答开放问题、按领域拆分 · 约 2k token</text>
    <rect x="40" y="240" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="262" font-weight="600" fill="#1e1b4b">5 · 读 LANE REPORT（≤ 40 行）</text>
    <text x="60" y="280" fill="#4338ca">接受，或回发修正后的 spec</text>
    <rect x="40" y="330" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="352" font-weight="600" fill="#1e1b4b">7 · 终审：ship / fix-first / rethink</text>
    <text x="60" y="370" fill="#4338ca">附账本行汇报给用户</text>
  </g>
  <g>
    <rect x="480" y="60" width="440" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="82" font-weight="600" fill="#064e3b">2 · 分析通道（codex，契约只读）</text>
    <text x="500" y="100" fill="#047857">读仓库 → 30 行 BRIEF + 六段式 SPEC 草稿</text>
    <rect x="480" y="150" width="440" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="172" font-weight="600" fill="#064e3b">4 · lane-run.mjs（确定性驱动，没有 LLM 监督）</text>
    <text x="500" y="190" fill="#047857">spec-lint → codex 在自己的 worktree 改代码 → 脚本重跑测试</text>
    <text x="500" y="208" fill="#047857">→ 失败把输出喂回同一会话续跑（≤ 2）→ 文件围栏 → 锁文件检查</text>
    <rect x="480" y="258" width="440" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="280" font-weight="600" fill="#064e3b">6 · 跨厂商评审（codex 读整个 diff）</text>
    <text x="500" y="298" fill="#047857">bug、越界改动、缺测试、未点名的风险，给出 VERDICT</text>
  </g>
  <path d="M400 86 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 100 C450 100 450 176 400 176" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M400 176 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 208 C450 208 450 266 400 266" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M400 266 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 298 C450 298 450 356 400 356" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="480" y="345" font-size="12" fill="#6b7280">并行任务：一个通道一个 git worktree · 串行合并，合并前干跑查冲突</text>
  <text x="480" y="365" font-size="12" fill="#6b7280">每次调用追加到 ~/.claude/llm-usage.jsonl → 算出 claude : external 比例</text>
</svg>
