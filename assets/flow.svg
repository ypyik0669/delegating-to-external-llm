<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- lanes header -->
  <text x="60" y="34" font-size="12" fill="#6b7280" letter-spacing="1">CLAUDE (session model) · judgment only</text>
  <text x="470" y="34" font-size="12" fill="#6b7280" letter-spacing="1">EXTERNAL MODEL on your relay · all reading, writing, reviewing</text>
  <line x1="440" y1="44" x2="440" y2="400" stroke="#e5e7eb" stroke-dasharray="4 4"/>

  <!-- Claude column -->
  <g>
    <rect x="40" y="60" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="82" font-weight="600" fill="#1e1b4b">1 · task in one sentence</text>
    <text x="60" y="100" fill="#4338ca">no reading the codebase</text>

    <rect x="40" y="150" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="172" font-weight="600" fill="#1e1b4b">3 · approve the spec draft</text>
    <text x="60" y="190" fill="#4338ca">answer open questions, split by domain · ≈ 2k tokens</text>

    <rect x="40" y="240" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="262" font-weight="600" fill="#1e1b4b">5 · read LANE REPORT (≤ 40 lines)</text>
    <text x="60" y="280" fill="#4338ca">accept, or send a corrected spec</text>

    <rect x="40" y="330" width="360" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="60" y="352" font-weight="600" fill="#1e1b4b">7 · verdict: ship / fix-first / rethink</text>
    <text x="60" y="370" fill="#4338ca">+ ledger line to the user</text>
  </g>

  <!-- External column -->
  <g>
    <rect x="480" y="60" width="440" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="82" font-weight="600" fill="#064e3b">2 · analyze lane  (codex, read-only by contract)</text>
    <text x="500" y="100" fill="#047857">reads the repo → 30-line BRIEF + six-part SPEC DRAFT</text>

    <rect x="480" y="150" width="440" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="172" font-weight="600" fill="#064e3b">4 · lane-run.mjs  (deterministic driver, no LLM supervisor)</text>
    <text x="500" y="190" fill="#047857">spec-lint → codex edits in its worktree → script re-runs tests</text>
    <text x="500" y="208" fill="#047857">→ resume with failing output (≤ 2) → file fence → lockfile check</text>

    <rect x="480" y="258" width="440" height="52" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="500" y="280" font-weight="600" fill="#064e3b">6 · cross-vendor review  (codex reads the whole diff)</text>
    <text x="500" y="298" fill="#047857">bugs, scope creep, missing tests, unnamed risks, VERDICT</text>
  </g>

  <!-- arrows -->
  <path d="M400 86 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 100 C450 100 450 176 400 176" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M400 176 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 208 C450 208 450 266 400 266" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M400 266 H480" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M480 298 C450 298 450 356 400 356" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <text x="480" y="345" font-size="12" fill="#6b7280">parallel tasks: one git worktree per lane · merged serially with a dry-run conflict check</text>
  <text x="480" y="365" font-size="12" fill="#6b7280">every call is appended to ~/.claude/llm-usage.jsonl → `claude : external` ratio</text>
</svg>
